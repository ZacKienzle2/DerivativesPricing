[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "derivatives-pricing"
version = "0.1.0"
description = "Stochastic process pricing engine with a Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zac Kienzle" }]
keywords = ["options", "monte-carlo", "stochastic-volatility", "calibration", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "numba>=0.58",
    "pandas>=2.0",
    "plotly>=5.18",
    "streamlit>=1.32",
]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
dev = ["pytest>=8", "ruff>=0.4", "black>=24", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "utils*", "ui*", "services*"]
exclude = ["tests*", "writeup*", "static*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = [
    "E501",   # line too long (formatter handles)
    "E701",   # multiple statements on one line (math kernels)
    "E702",   # multiple statements on one line via semicolon
    "E741",   # ambiguous variable name (math notation)
    "N802",   # invalid function name (lower-case math fns)
    "N803",   # invalid argument name (math notation)
    "N806",   # uppercase variable in function (S, K, T notation)
    "N813",   # camelcase imported as lowercase
    "N816",   # mixed-case-variable-in-global-scope
    "SIM103", # needless-bool
    "SIM108", # use ternary operator (cosmetic)
    "B008",   # function call in default argument (frozen dataclass default)
    "B024",   # abstract base class without abstract method (Protocol-like)
    "B904",   # raise without from inside except (logging path)
    "B905",   # zip without explicit strict
    "F821",   # undefined name (numba prange resolved at jit time)
    "F841",   # unused local variable (intermediate math results)
    "UP031",  # use f-string instead of percent formatting
]

[tool.ruff.lint.per-file-ignores]
"models/pricers/_warmup.py" = ["F401"]
"models/options/__init__.py" = ["F401"]
"models/processes/__init__.py" = ["F401"]
"models/calibration/__init__.py" = ["F401"]
"utils/greeks/__init__.py" = ["F401"]
"models/processes/registry.py" = ["F401"]
"models/processes/*.py" = ["E402"]
"controller.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
