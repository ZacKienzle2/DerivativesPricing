[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "derivatives-pricing"
version = "0.1.0"
description = "Stochastic process pricing engine with a Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zac Kienzle" }]
keywords = ["options", "monte-carlo", "stochastic-volatility", "calibration", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "numba>=0.58",
    "pandas>=2.0",
    "plotly>=5.18",
    "streamlit>=1.32",
]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
dev = ["pytest>=8", "ruff>=0.4", "black>=24", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "utils*", "ui*", "services*"]
exclude = ["tests*", "writeup*", "static*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"models/pricers/_warmup.py" = ["F401"]
"models/options/__init__.py" = ["F401"]
"models/processes/__init__.py" = ["F401"]
"models/calibration/__init__.py" = ["F401"]
"utils/greeks/__init__.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
